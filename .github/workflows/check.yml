name: Check blog
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          baseurl: /tech
